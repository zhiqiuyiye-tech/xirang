apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: control-panel-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
data:
  # Master key for at-rest encryption of per-worker SSH credentials.
  AES_KEY: {{ include "control-panel.aesKey" . }}
  # JWT signing secret for admin session tokens.
  JWT_SECRET: {{ include "control-panel.jwtSecret" . }}
  # Initial admin password (seeded on first startup). Retrieve after install:
  #   kubectl -n control-panel get secret control-panel-secrets \
  #     -o jsonpath='{.data.ADMIN_INIT_PASSWORD}' | base64 -d
  ADMIN_INIT_PASSWORD: {{ include "control-panel.adminPassword" . }}
