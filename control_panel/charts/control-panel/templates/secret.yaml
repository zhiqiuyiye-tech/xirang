apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: control-panel-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
data:
  # Master key for at-rest encryption of per-worker SSH credentials.
  # Values are reused from the existing Secret on upgrade (lookup) so they stay
  # stable across upgrades - regenerating would invalidate encrypted worker
  # credentials and admin sessions. Pin via values.secrets to override.
  AES_KEY: {{ include "control-panel.secretValue" (dict "Release" .Release "key" "AES_KEY" "pinned" .Values.secrets.aesKey "gen" (randBytes 32 | b64enc)) }}
  JWT_SECRET: {{ include "control-panel.secretValue" (dict "Release" .Release "key" "JWT_SECRET" "pinned" .Values.secrets.jwtSecret "gen" (randBytes 32 | b64enc)) }}
  # Initial admin password (seeded on first startup; reused on upgrade).
  # Retrieve after install:
  #   kubectl -n control-panel get secret control-panel-secrets \
  #     -o jsonpath='{.data.ADMIN_INIT_PASSWORD}' | base64 -d
  ADMIN_INIT_PASSWORD: {{ include "control-panel.secretValue" (dict "Release" .Release "key" "ADMIN_INIT_PASSWORD" "pinned" (.Values.secrets.adminPassword | b64enc) "gen" (randAlphaNum 16 | b64enc)) }}
