apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-panel
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-panel
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
rules:
  # Services: full CRUD (SVC port mapping management).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # NetworkPolicies: full CRUD (ingress rules management).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Pods: read-only (look up Pod UID/name for ownerReferences, so created
  # SVC/NetworkPolicy resources are GC'd with the target pod).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Nodes: read-only (discover cluster nodes to prefill worker records).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-panel
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-panel
subjects:
  - kind: ServiceAccount
    name: control-panel
    namespace: {{ .Values.namespace }}
