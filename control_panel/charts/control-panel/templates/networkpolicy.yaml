{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "control-panel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressCIDRs }}
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # 1. Allow DNS resolution within cluster
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Allow communication with Kubernetes API Server
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # 3. Allow SSH to worker nodes (port 22)
    - ports:
        - protocol: TCP
          port: 22
{{- end }}
