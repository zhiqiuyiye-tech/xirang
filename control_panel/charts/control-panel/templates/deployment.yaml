apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "control-panel.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "control-panel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "control-panel.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: control-panel
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-panel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: AES_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: JWT_SECRET
            - name: ADMIN_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: ADMIN_INIT_PASSWORD
            - name: DB_PATH
              value: /data/control_panel.db
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: REQUIRE_K8S
              value: "{{ .Values.config.requireK8s }}"
            - name: COOKIE_SECURE
              value: "{{ .Values.config.cookieSecure }}"
            - name: COOKIE_SAMESITE
              value: "{{ .Values.config.cookieSameSite }}"
            - name: JWT_TTL
              value: "{{ .Values.config.jwtTTL }}"
            - name: WORKER_HEARTBEAT_TIMEOUT
              value: {{ .Values.config.workerHeartbeatTimeout | default "30s" | quote }}
            - name: WORKER_ACCELERATOR_TIMEOUT
              value: {{ .Values.config.workerAcceleratorTimeout | default "45s" | quote }}
            - name: NAMESPACE_CLEANUP_ALLOWLIST
              value: {{ join "," (.Values.config.namespaceCleanupAllowlist | default (list)) | quote }}
            - name: NAMESPACE_CLEANUP_TIMEOUT
              value: {{ .Values.config.namespaceCleanupTimeout | default "60s" | quote }}
            - name: NAMESPACE_UNMOUNT_TIMEOUT
              value: {{ .Values.config.namespaceUnmountTimeout | default "10s" | quote }}
            {{- if .Values.config.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: "{{ join "," .Values.config.trustedProxies }}"
            {{- end }}
            - name: LOGIN_RATE_LIMIT_MAX_FAILURES
              value: "{{ .Values.config.rateLimitMaxFailures }}"
            - name: LOGIN_RATE_LIMIT_LOCKOUT_DURATION
              value: "{{ .Values.config.rateLimitLockoutDuration }}"
            - name: AUTH_CHALLENGE_RATE_LIMIT_PER_MINUTE
              value: "{{ .Values.config.challengeRateLimitPerMinute }}"
            - name: AUTH_CHALLENGE_MAX_PENDING_PER_IP
              value: "{{ .Values.config.challengeMaxPendingPerIP }}"
            - name: AUTH_CHALLENGE_MAX_PENDING_GLOBAL
              value: "{{ .Values.config.challengeMaxPendingGlobal }}"
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: false
            - name: tmp
              mountPath: /tmp
              readOnly: false
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: control-panel-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
