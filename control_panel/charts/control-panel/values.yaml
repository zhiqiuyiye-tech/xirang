# Control panel Helm chart values.
# All secrets (AES_KEY, JWT_SECRET, ADMIN_INIT_PASSWORD) are auto-generated on
# install via randAlphaNum - no manual setup needed. Override image/port/storage
# here if your environment differs.

# Container image (private registry). The master node must be able to pull this.
image:
  repository: registry-xirang.jxslpt.cn:30443/tai-dev/control-panel
  tag: latest
  pullPolicy: Always
  # If the registry requires auth, create an imagePullSecret and set its name:
  # imagePullSecrets:
  #   - name: my-registry-secret

namespace: control-panel

# Service exposure. NodePort is the default for internal admin access.
service:
  type: NodePort
  port: 8080
  nodePort: 30180

# Persistent storage for the SQLite database (worker creds, tasks, audit log).
persistence:
  enabled: true
  size: 1Gi
  storageClassName: "local-path"  # K3s default; set to "" for cluster default

# Secrets auto-generated on install. To pin them (e.g. for upgrades preserving
# encrypted data), set these - otherwise randAlphaNum generates fresh values.
secrets:
  aesKey: ""         # leave empty to auto-generate (base64 32-byte)
  jwtSecret: ""      # leave empty to auto-generate (base64)
  adminPassword: ""  # leave empty to auto-generate (retrieve after install)

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
