# Control panel Helm chart values.
# All secrets (AES_KEY, JWT_SECRET, ADMIN_INIT_PASSWORD) are auto-generated on
# install via randAlphaNum - no manual setup needed. Override image/port/storage
# here if your environment differs.

image:
  repository: registry-xirang.jxslpt.cn:30443/tai-dev/control-panel
  tag: latest
  pullPolicy: Always
  # imagePullSecrets:
  #   - name: my-registry-secret

namespace: control-panel

# Service exposure. NodePort or ClusterIP (recommended when Ingress is enabled).
service:
  type: NodePort
  port: 8080
  nodePort: 30180

# Ingress configuration (recommended for production HTTPS deployment)
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
  hosts:
    - host: control-panel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: control-panel-tls
    #   hosts:
    #     - control-panel.local

# NetworkPolicy for internal network isolation and boundary defense
networkPolicy:
  enabled: false
  # CIDRs allowed to access the control panel UI / API
  ingressCIDRs: []
    # - 10.0.0.0/8
    # - 192.168.0.0/16

# Security context for pod and container.
# Defaults allow running as root to ensure full compatibility with root-owned persistent volumes.
podSecurityContext: {}
  # runAsNonRoot: false
  # seccompProfile:
  #   type: RuntimeDefault

securityContext: {}
  # allowPrivilegeEscalation: false

# Application environment configuration
config:
  requireK8s: true
  cookieSecure: false  # Set to true when accessed over HTTPS
  cookieSameSite: "Lax"
  trustedProxies: []
  rateLimitMaxFailures: 5
  rateLimitLockoutDuration: "15m"

# Persistent storage for the SQLite database.
# MUST use a block-based or local StorageClass (local-path, hostPath, Ceph RBD, Longhorn).
# DO NOT use regular NFS for WAL-mode SQLite database!
persistence:
  enabled: true
  size: 1Gi
  storageClassName: "local-path"  # K3s default; set to "" for cluster default

# Secrets auto-generated on install.
secrets:
  aesKey: ""         # leave empty to auto-generate (base64 32-byte)
  jwtSecret: ""      # leave empty to auto-generate (base64)
  adminPassword: ""  # leave empty to auto-generate (retrieve after install)

scheduling:
  nodeSelector: {}
  tolerations: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
