# Control panel Deployment.
#
# Requires (already applied): rbac.yaml (Namespace+SA+RBAC), pvc.yaml,
# service.yaml, and a Secret 'control-panel-secrets' with keys AES_KEY,
# JWT_SECRET, ADMIN_INIT_PASSWORD (generated by install.sh or from
# secret.yaml.template).
#
# The container image is pulled from the private registry. Build, tag, and push
# it first (run on a host with docker):
#   docker build -t registry-xirang.jxslpt.cn:30443/tai-dev/control-panel:latest control_panel/backend
#   docker push registry-xirang.jxslpt.cn:30443/tai-dev/control-panel:latest
# If the registry uses a self-signed/HTTP-only cert, the cluster nodes must trust
# it (configure insecure-registries or install the CA) or use an imagePullSecret.
#
# Apply with: kubectl apply -f deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-panel
  namespace: control-panel
  labels:
    app.kubernetes.io/name: control-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: control-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-panel
    spec:
      serviceAccountName: control-panel
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-panel
          image: registry-xirang.jxslpt.cn:30443/tai-dev/control-panel:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AES_KEY
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: AES_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: JWT_SECRET
            - name: ADMIN_INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: control-panel-secrets
                  key: ADMIN_INIT_PASSWORD
            # Optional overrides (safe defaults are set in the binary).
            - name: DB_PATH
              value: /data/control_panel.db
            - name: LISTEN_ADDR
              value: ":8080"
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: false
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: control-panel-data
