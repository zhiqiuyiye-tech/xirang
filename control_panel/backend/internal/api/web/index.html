<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>息壤 控制面板 · Xirang Console</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><path d='M8 20L16 8l8 12H8z' fill='%23ffffff'/><circle cx='16' cy='18' r='3' fill='%2360a5fa'/></svg>">
    <link rel="stylesheet" href="/static/styles.css?v=0.7.0">
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="login-view">
        <div class="login-bg-decorations">
            <div class="login-glow login-glow-1"></div>
            <div class="login-glow login-glow-2"></div>
            <div class="login-grid-pattern"></div>
        </div>
        <div class="login-card">
            <div class="login-header">
                <div class="login-brand-badge">
                    <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="32" height="32" rx="8" fill="url(#login-brand-grad)"/>
                        <path d="M7 16L16 7L25 16L16 25L7 16Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <circle cx="16" cy="16" r="3.5" fill="white"/>
                        <defs>
                            <linearGradient id="login-brand-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6"/>
                                <stop stop-color="#1d4ed8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="login-title">息壤 控制面板</h1>
                <p class="login-subtitle">云原生算力与分布式存储基础设施管控系统</p>
            </div>
            <form id="login-form">
                <div class="form-field">
                    <label for="login-username">管理员账号</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                        <input type="text" id="login-username" name="username" placeholder="请输入管理员用户名" required autocomplete="username">
                    </div>
                </div>
                <div class="form-field">
                    <label for="login-password">访问密码</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                        </svg>
                        <input type="password" id="login-password" name="password" placeholder="请输入访问密钥或密码" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <span>登 录 控 制 台</span>
                    <svg class="btn-arrow-icon" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="login-error" class="error-msg"></div>
            </form>
            <div class="login-footer">
                <span class="security-badge">
                    <svg class="security-icon" viewBox="0 0 16 16" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.464 9.99 1.694 2.216 3.71 3.144 4.195 3.303a.5.5 0 0 0 .4 0c.485-.16 2.501-1.087 4.195-3.303 1.677-2.195 3.06-5.513 2.464-9.99a1.54 1.54 0 0 0-1.044-1.263 62.72 62.72 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm2.146 5.146a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647z"/>
                    </svg>
                    TLS 传输加密 · 敏感凭证 AES-256 安全隔离
                </span>
            </div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="app-view" style="display:none;">
        <header class="app-header">
            <nav class="navbar">
                <div class="navbar-left">
                    <div class="navbar-brand">
                        <div class="brand-logo-wrap">
                            <svg class="brand-logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="32" height="32" rx="7" fill="url(#nav-brand-grad)"/>
                                <path d="M8 16L16 8L24 16L16 24L8 16Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                                <circle cx="16" cy="16" r="3" fill="#93c5fd"/>
                                <defs>
                                    <linearGradient id="nav-brand-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#3b82f6"/>
                                        <stop stop-color="#1d4ed8"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>
                        <div class="brand-text-group">
                            <span class="brand-name">息壤 控制面板</span>
                            <span class="brand-tag">XIRANG CONSOLE</span>
                            <span class="brand-version">v0.7.0</span>
                        </div>
                    </div>

                    <div class="navbar-links">
                        <a href="#/workers" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M2 5a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 01-2 2H4a2 2 0 01-2-2V5zm14 1a1 1 0 11-2 0 1 1 0 012 0zM2 13a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 01-2 2H4a2 2 0 01-2-2v-2zm14 1a1 1 0 11-2 0 1 1 0 012 0z" clip-rule="evenodd"/>
                            </svg>
                            <span>Worker 节点</span>
                        </a>
                        <a href="#/k8s" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"/>
                            </svg>
                            <span>端口映射</span>
                        </a>
                        <a href="#/storage" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M3 12v3c0 1.657 3.134 3 7 3s7-1.343 7-3v-3c0 1.657-3.134 3-7 3s-7-1.343-7-3z"/>
                                <path d="M3 7v3c0 1.657 3.134 3 7 3s7-1.343 7-3V7c0 1.657-3.134 3-7 3S3 8.657 3 7z"/>
                                <path d="M17 5c0 1.657-3.134 3-7 3S3 6.657 3 5s3.134-3 7-3 7 1.343 7 3z"/>
                            </svg>
                            <span>NFS 存储</span>
                        </a>
                        <a href="#/tasks" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm2 10a1 1 0 10-2 0v3a1 1 0 102 0v-3zm2-3a1 1 0 011 1v5a1 1 0 11-2 0v-5a1 1 0 011-1zm4-1a1 1 0 10-2 0v7a1 1 0 102 0V8z" clip-rule="evenodd"/>
                            </svg>
                            <span>任务</span>
                        </a>
                        <a href="#/audit" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
                            </svg>
                            <span>审计日志</span>
                        </a>
                        <a href="#/security" class="nav-link">
                            <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                            <span>系统安全</span>
                        </a>
                    </div>
                </div>

                <div class="navbar-right">
                    <div class="cluster-status-pill">
                        <span class="status-pulse-dot"></span>
                        <span class="status-label">控制平面运行中</span>
                    </div>
                    <div class="user-profile-badge">
                        <div class="user-avatar">
                            <svg viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                        <span class="user-name">系统管理员</span>
                    </div>
                    <button id="change-pwd-btn" class="btn btn-secondary btn-sm" title="修改管理员密码" style="display:inline-flex;align-items:center;gap:4px;margin-right:6px;">
                        <svg viewBox="0 0 20 20" fill="currentColor" style="width:14px;height:14px;">
                            <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd"/>
                        </svg>
                        <span>修改密码</span>
                    </button>
                    <button id="logout-btn" class="btn btn-logout" title="退出当前登录">
                        <svg class="logout-icon" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
                        </svg>
                        <span>退出</span>
                    </button>
                </div>
            </nav>
        </header>

        <main id="page-content" class="page-content">
            <!-- Pages render here -->
        </main>
    </div>

    <script src="/static/app.js?v=0.7.0"></script>
</body>
</html>
