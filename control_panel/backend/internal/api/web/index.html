<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xirang Control Panel</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="login-view">
        <div class="login-card">
            <h1>Xirang Control Panel</h1>
            <form id="login-form">
                <div class="form-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required autocomplete="username">
                </div>
                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="app-view" style="display:none;">
        <nav class="navbar">
            <div class="navbar-brand">Xirang CP</div>
            <div class="navbar-links">
                <a href="#/workers" class="nav-link">Workers</a>
                <a href="#/k8s" class="nav-link">K8s</a>
                <a href="#/storage" class="nav-link">Storage</a>
                <a href="#/tasks" class="nav-link">Tasks</a>
                <a href="#/audit" class="nav-link">Audit</a>
                <button id="logout-btn" class="btn btn-link">Logout</button>
            </div>
        </nav>
        <main id="page-content" class="page-content">
            <!-- Pages render here -->
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
