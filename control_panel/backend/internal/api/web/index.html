<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>息壤 控制面板</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="login-view">
        <div class="login-card">
            <h1>息壤 控制面板</h1>
            <form id="login-form">
                <div class="form-field">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" name="username" required autocomplete="username">
                </div>
                <div class="form-field">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="app-view" style="display:none;">
        <nav class="navbar">
            <div class="navbar-brand">息壤 控制面板</div>
            <div class="navbar-links">
                <a href="#/workers" class="nav-link">Worker 节点</a>
                <a href="#/k8s" class="nav-link">K8s 资源</a>
                <a href="#/storage" class="nav-link">存储编排</a>
                <a href="#/tasks" class="nav-link">任务</a>
                <a href="#/audit" class="nav-link">审计日志</a>
                <button id="logout-btn" class="btn btn-link">退出</button>
            </div>
        </nav>
        <main id="page-content" class="page-content">
            <!-- Pages render here -->
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
